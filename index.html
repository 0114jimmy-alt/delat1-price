<!doctype html>

<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Open Road｜自由駕駛</title>

<style>

:root{--bg:#10151b;--panel:#1b2630;--accent:#67efb0;--muted:#aab6c0}

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;touch-action:none}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}

.stat{background:#111a22dd;border:1px solid #ffffff20;border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.45}

#controls{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,8px) + 12px);display:flex;justify-content:space-between;align-items:end;pointer-events:none}

.group{display:flex;gap:9px;pointer-events:auto}

.ctrl{width:62px;height:62px;border:1px solid #ffffff40;border-radius:18px;background:#101820d9;color:#fff;font-size:18px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}

.ctrl.gas{height:78px;background:#147953e8}.ctrl.brake{height:68px;background:#a43743e8}.ctrl:active{filter:brightness(1.35);transform:scale(.96)}

#openMenu{position:fixed;right:10px;top:86px;border:0;border-radius:12px;padding:10px 12px;background:#111a22df;color:white;font-weight:bold}

#menu{position:fixed;inset:0;background:#091018df;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}

.card{width:min(540px,100%);max-height:94dvh;overflow:auto;background:#1a2530;border:1px solid #ffffff20;border-radius:20px;padding:18px;box-shadow:0 20px 70px #0008}

h1{font-size:27px;margin:0 0 5px}p{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 14px}

.tabs{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}.tabs button,button{border:0;border-radius:11px;background:#30404d;color:white;padding:11px 13px;font-weight:750;font-size:14px}

.tabs button.active,.primary{background:var(--accent);color:#102018}

.panel{background:#101820;border-radius:13px;padding:12px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.small{font-size:12px;color:var(--muted)}

.actions{display:flex;gap:8px}.actions button{flex:1}.section[hidden]{display:none}

#toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#101820e8;border:1px solid #ffffff20;padding:11px 15px;border-radius:12px;display:none;white-space:nowrap}

@media(min-width:700px){.ctrl{width:72px;height:72px}.ctrl.gas{height:88px}}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

 <div class="stat">🚘 <b id="hudCar">街頭跑車</b><br><b id="speed">0</b> km/h</div>

 <div class="stat">距離 <b id="distance">0</b> m<br>點數 <b id="coins">0</b></div>

 <div class="stat">最佳 <b id="best">0</b> m</div>

</div>

<button id="openMenu">☰ 選單</button>

<div id="controls">

 <div class="group"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div>

 <div class="group"><button class="ctrl brake" data-key="brake">煞車</button><button class="ctrl gas" data-key="gas">油門</button></div>

</div>

<div id="toast"></div>

<div id="menu">

 <div class="card">

  <h1>🏁 OPEN ROAD</h1><p>開放世界自由駕駛。探索城市道路、避開車流、賺取點數並升級愛車。</p>

  <div class="tabs"><button class="active" data-tab="drive">駕駛</button><button data-tab="garage">車庫改裝</button><button data-tab="records">紀錄</button></div>

  <section class="section" id="drive">

   <div class="panel"><div class="row"><span>目前車輛</span><b id="selectedCar">街頭跑車</b></div><div class="actions"><button id="prev">◀ 換車</button><button id="next">換車 ▶</button></div><p id="carDesc">均衡入門車款</p></div>

   <div class="actions"><button class="primary" id="start">開始駕駛</button><button id="sound">🔊 音效開</button></div>

   <p class="small">手機可橫向遊玩。按住左右鍵轉向，油門加速，煞車減速。撞到車會停下，再按油門重新起步。</p>

  </section>

  <section class="section" id="garage" hidden>

   <div class="panel"><div class="row"><span>可用點數</span><b id="garageCoins">0</b></div><div class="row"><span>引擎等級 <b id="engineLv">1</b></span><button id="upEngine">升級 100 點</button></div><div class="row"><span>操控等級 <b id="handlingLv">1</b></span><button id="upHandling">升級 100 點</button></div><div class="row"><span>煞車等級 <b id="brakeLv">1</b></span><button id="upBrake">升級 100 點</button></div></div>

   <div class="panel"><b>車輛</b><div id="cars"></div></div>

  </section>

  <section class="section" id="records" hidden>

   <div class="panel"><div class="row"><span>最佳距離</span><b id="recBest">0 m</b></div><div class="row"><span>累積距離</span><b id="recTotal">0 m</b></div><div class="row"><span>點數</span><b id="recCoins">0</b></div><div class="row"><span>碰撞次數</span><b id="recHits">0</b></div></div>

   <p class="small">紀錄保存在目前 Safari 的本機儲存空間。</p><button id="reset">重設紀錄</button>

  </section>

 </div>

</div>

<script>

(()=>{'use strict';

const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');

const cars=[

 {name:'街頭跑車',price:0,color:'#f5f6f7',speed:1,turn:1,desc:'均衡入門車款'},

 {name:'霓虹轎跑',price:250,color:'#61e6aa',speed:1.16,turn:1.05,desc:'加速快，適合城市巡航'},

 {name:'火焰肌肉車',price:600,color:'#ff765d',speed:1.32,turn:.88,desc:'直線速度強，轉向較重'},

 {name:'電光超跑',price:1100,color:'#9d91ff',speed:1.48,turn:1.22,desc:'速度與操控兼備'}

];

const base={coins:0,unlocked:[0],car:0,engine:1,handling:1,brake:1,best:0,total:0,hits:0};

let save;try{save=Object.assign({},base,JSON.parse(localStorage.getItem('openRoadSave')||'{}'));if(!Array.isArray(save.unlocked))save.unlocked=[0]}catch(e){save={...base}}

function persist(){try{localStorage.setItem('openRoadSave',JSON.stringify(save))}catch(e){}ui()}

let W=innerWidth,H=innerHeight,D=1;

function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

let running=false,world=0,xPlayer=0,speed=0,distance=0,coinMeter=0,traffic=[],last=0,hitLock=0,flash=0;

const input={left:false,right:false,gas:false,brake:false};

let soundOn=true,audio=null,osc=null,oscGain=null,musicTimer=null,musicIndex=0;

function audioInit(){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!osc){osc=audio.createOscillator();oscGain=audio.createGain();osc.type='sawtooth';oscGain.gain.value=0;osc.connect(oscGain);oscGain.connect(audio.destination);osc.start()}if(!musicTimer){musicTimer=setInterval(()=>{if(!soundOn||!audio||audio.state!=='running')return;let ns=[220,277,330,277,196,247,294,247],o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=ns[musicIndex++%ns.length];g.gain.setValueAtTime(.018,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.17);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18)},300)}}catch(e){}}

function beep(f=110,d=.18,type='square',v=.08){if(!soundOn)return;audioInit();if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}

function ui(){

 $('hudCar').textContent=cars[save.car].name;$('selectedCar').textContent=cars[save.car].name;$('carDesc').textContent=cars[save.car].desc;

 $('speed').textContent=Math.round(speed*1.5);$('distance').textContent=Math.floor(distance);$('coins').textContent=save.coins;$('best').textContent=save.best;

 $('garageCoins').textContent=save.coins;$('engineLv').textContent=save.engine;$('handlingLv').textContent=save.handling;$('brakeLv').textContent=save.brake;

 $('recBest').textContent=save.best+' m';$('recTotal').textContent=Math.floor(save.total)+' m';$('recCoins').textContent=save.coins;$('recHits').textContent=save.hits;

 $('cars').innerHTML=cars.map((c,i)=>`<div class="row"><span>${c.name} · ${save.unlocked.includes(i)?'已解鎖':c.price+' 點'}</span><button data-car="${i}" ${save.unlocked.includes(i)?(save.car===i?'disabled':''):(save.coins<c.price?'disabled':'')}>${save.unlocked.includes(i)?(save.car===i?'使用中':'選擇'): '解鎖'}</button></div>`).join('');

}

let toastTimer;function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1500)}

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.hidden=x.id!==b.dataset.tab)});

function cycle(d){let j=save.unlocked.indexOf(save.car);save.car=save.unlocked[(j+d+save.unlocked.length)%save.unlocked.length];persist()}

$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);

$('cars').onclick=e=>{let b=e.target.closest('[data-car]');if(!b)return;let i=+b.dataset.car;if(save.unlocked.includes(i)){save.car=i;persist()}else if(save.coins>=cars[i].price){save.coins-=cars[i].price;save.unlocked.push(i);save.car=i;persist();toast('已解鎖 '+cars[i].name)}};

function upgrade(k){let cost=save[k]*100;if(save[k]>=5)return toast('已達最高等級');if(save.coins<cost)return toast('點數不足');save.coins-=cost;save[k]++;persist();beep(620,.1,'sine')}

$('upEngine').onclick=()=>upgrade('engine');$('upHandling').onclick=()=>upgrade('handling');$('upBrake').onclick=()=>upgrade('brake');

$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效開':'🔇 音效關';if(soundOn)audioInit();else if(oscGain&&audio)oscGain.gain.setTargetAtTime(0,audio.currentTime,.05)};

$('reset').onclick=()=>{if(confirm('確定重設所有紀錄與車輛解鎖？')){save={...base,unlocked:[0]};persist();toast('紀錄已重設')}};

function spawn(){traffic=[];for(let i=0;i<9;i++)traffic.push({x:(Math.random()-.5)*.82,y:-i*250-150,color:['#e65b50','#e7bd4d','#548bd3','#eeeeee'][i%4],size:.7+Math.random()*.4})}

function start(){audioInit();$('menu').style.display='none';running=true;last=performance.now();if(!traffic.length)spawn();requestAnimationFrame(loop);toast('自由駕駛開始')}

$('start').onclick=start;$('openMenu').onclick=()=>{running=false;$('menu').style.display='flex';ui()};

const keyMap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'brake'};

addEventListener('keydown',e=>{if(keyMap[e.key]){input[keyMap[e.key]]=true;e.preventDefault()}});

addEventListener('keyup',e=>{if(keyMap[e.key])input[keyMap[e.key]]=false});

document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();input[k]=true;b.setPointerCapture?.(e.pointerId);if(k==='gas'){audioInit();if(speed===0&&hitLock>0){hitLock=0;toast('重新起步')}}};const up=e=>{e.preventDefault();input[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up))});

function collision(){if(hitLock>0)return;speed=0;hitLock=1.25;flash=.5;save.hits++;beep(70,.3,'sawtooth',.13);persist();toast('撞車！已停止，按油門重新起步')}

function update(dt){if(!running)return;hitLock=Math.max(0,hitLock-dt);flash=Math.max(0,flash-dt);const c=cars[save.car],max=(42+save.engine*8)*c.speed;

 if(input.gas){if(speed===0&&hitLock>0)hitLock=0;speed=Math.min(max,speed+(16+save.engine*3)*dt)}else if(input.brake)speed=Math.max(0,speed-(35+save.brake*10)*dt);else speed=Math.max(0,speed-4*dt);

 if(input.left)xPlayer-=dt*(.78+speed/85)*(1+save.handling*.09)*c.turn;if(input.right)xPlayer+=dt*(.78+speed/85)*(1+save.handling*.09)*c.turn;xPlayer=Math.max(-1.03,Math.min(1.03,xPlayer));

 if(Math.abs(xPlayer)>.97){speed=Math.max(0,speed-25*dt);xPlayer=Math.sign(xPlayer)*.97}

 let travel=speed*dt*2.2;world+=travel;distance+=travel*.1;save.total+=travel*.1;coinMeter+=travel*.05;if(coinMeter>=1){let n=Math.floor(coinMeter);save.coins+=n;coinMeter-=n}

 for(let t of traffic){t.y+=travel*(1.15-t.size*.18);if(t.y>H+80){t.y=-120-Math.random()*400;t.x=(Math.random()-.5)*.84;t.color=['#e65b50','#e7bd4d','#548bd3','#eeeeee'][Math.floor(Math.random()*4)]}

 let px=W/2+xPlayer*W*.28,py=H*.75,tx=W/2+curve(t.y)+t.x*Math.min(W*.4,270),ty=t.y;

 if(Math.abs(px-tx)<Math.max(27,W*.045)&&Math.abs(py-ty)<48&&speed>1){collision();t.y=-600-Math.random()*250}}

 if(distance>save.best)save.best=Math.floor(distance);

 if(osc&&audio){try{osc.frequency.setTargetAtTime(65+speed*2.3,audio.currentTime,.08);oscGain.gain.setTargetAtTime(soundOn?Math.min(.04,speed/1700):0,audio.currentTime,.08)}catch(e){}}

 ui()}

function curve(z){return Math.sin((world+z)*.001)*W*.07+Math.sin((world+z)*.0004)*W*.04}

function carDraw(x,y,w,h,color,player){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(2,h*.22,w*.68,h*.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-w*.42,h*.48);ctx.lineTo(-w*.5,-h*.12);ctx.lineTo(-w*.28,-h*.48);ctx.lineTo(w*.28,-h*.48);ctx.lineTo(w*.5,-h*.12);ctx.lineTo(w*.42,h*.48);ctx.closePath();ctx.fill();ctx.fillStyle='#193040';ctx.beginPath();ctx.moveTo(-w*.27,-h*.14);ctx.lineTo(-w*.18,-h*.38);ctx.lineTo(w*.18,-h*.38);ctx.lineTo(w*.27,-h*.14);ctx.closePath();ctx.fill();ctx.fillStyle=player?'#fff2a5':'#ff3f46';ctx.fillRect(-w*.34,h*.25,w*.19,h*.09);ctx.fillRect(w*.15,h*.25,w*.19,h*.09);ctx.fillStyle='#111';ctx.fillRect(-w*.53,-h*.25,w*.12,h*.24);ctx.fillRect(w*.41,-h*.25,w*.12,h*.24);ctx.fillRect(-w*.53,h*.2,w*.12,h*.24);ctx.fillRect(w*.41,h*.2,w*.12,h*.24);ctx.restore()}

function render(){ctx.clearRect(0,0,W,H);let horizon=H*.31;ctx.fillStyle='#a0d9ed';ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#82b7b0';for(let i=0;i<13;i++){let x=i*W/11-(world*.07%(W/11)),hh=24+(i*31%68);ctx.fillRect(x,horizon-hh,W/18,hh)}ctx.fillStyle='#5d9b65';ctx.fillRect(0,horizon,W,H-horizon);

 for(let i=0;i<11;i++){let y=((i*118+world*.7)%(H+130))-65,b=35+(i*21%60);ctx.fillStyle=i%2?'#c9c5b8':'#ddd4c2';ctx.fillRect(8+(i%3)*8,y,b*.65,b);ctx.fillRect(W-b*.7-8,y+22,b*.65,b)}

 let cx=W/2+curve(0),top=Math.min(W*.24,145),bot=Math.min(W*.96,680);ctx.fillStyle='#555d63';ctx.beginPath();ctx.moveTo(cx-top/2,horizon);ctx.lineTo(cx+top/2,horizon);ctx.lineTo(W/2+bot/2,H);ctx.lineTo(W/2-bot/2,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#e9e5d1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-top/2,horizon);ctx.lineTo(W/2-bot/2,H);ctx.moveTo(cx+top/2,horizon);ctx.lineTo(W/2+bot/2,H);ctx.stroke();

 for(let i=0;i<13;i++){let z=((i*90+world*1.35)%(H-horizon)),y=horizon+z,p=z/(H-horizon),mw=1+p*4;ctx.fillStyle='#fff5d9';ctx.fillRect(W/2+curve(z)-mw/2,y,mw,10+p*23)}

 for(let t of traffic){let p=Math.max(.25,Math.min(1.3,(t.y-horizon)/(H-horizon)));carDraw(W/2+curve(t.y)+t.x*bot*.42,t.y,20+p*18,35+p*23,t.color,false)}

 carDraw(W/2+xPlayer*W*.28,H*.75,Math.max(34,W*.065),Math.max(58,H*.12),cars[save.car].color,true);if(flash>0){ctx.fillStyle=`rgba(255,45,45,${flash*.24})`;ctx.fillRect(0,0,W,H)}}

function loop(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);render();if(running)requestAnimationFrame(loop)}

ui();render();

})();

</script>

</body>

</html>
