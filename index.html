<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護航成果圖生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #16213e;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        h2 {
            color: #e0e0e0;
            font-weight: 400;
            text-align: center;
            margin-bottom: 18px;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .upload-area {
            background: #0f3460;
            border: 2px dashed #4a7cba;
            border-radius: 16px;
            padding: 30px 10px;
            text-align: center;
            color: #aac4e6;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: #1a3f6a;
        }
        .upload-area input {
            display: none;
        }
        .preview-box {
            background: #0d1b2a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        #resultCanvas {
            width: 100%;
            border-radius: 12px;
            display: block;
            background: #0b1622;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #f7971e88;
        }
        .btn-secondary {
            background: #2a3a5e;
        }
        .btn-secondary:hover {
            background: #3a4e7a;
        }
        .footnote {
            color: #6a7e9e;
            text-align: center;
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 護航成果圖生成</h2>

    <div class="upload-area" id="uploadArea">
        <span>📸 點擊上傳遊戲截圖</span>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="preview-box">
        <canvas id="resultCanvas" width="800" height="1200"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="downloadBtn">⬇ 下載成果圖</button>
        <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
    </div>
    <div class="footnote">上傳圖片後自動套用版型｜中間兩張圖替換為文字區塊</div>
</div>

<script>
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');

    let uploadedImage = null;

    // ---------- 繪製主圖 ----------
    function drawFinalImage(img) {
        const w = 800, h = 1200;
        canvas.width = w;
        canvas.height = h;

        // 背景
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0b1a2e');
        grad.addColorStop(1, '#14243e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        let y = 30;

        // ---- 1. 標題 ----
        ctx.fillStyle = '#f5e6c8';
        ctx.font = 'bold 32px "Segoe UI", "PingFang TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🔰 三角洲行動 · 護航報告', w/2, y);
        y += 20;
        ctx.font = '18px "Segoe UI", "PingFang TC", sans-serif';
        ctx.fillStyle = '#b8cce4';
        ctx.fillText('巴克什密｜對戰 23.8 分鐘', w/2, y);
        y += 50;

        // ---- 2. 上傳的圖片（遊戲成績）----
        if (img) {
            const imgW = 700;
            const ratio = img.width / img.height;
            let imgH = imgW / ratio;
            if (imgH > 400) { imgH = 400; }
            const imgX = (w - imgW) / 2;
            ctx.drawImage(img, imgX, y, imgW, imgH);
            y += imgH + 30;
        } else {
            ctx.fillStyle = '#2a3a5e';
            ctx.fillRect(50, y, 700, 260);
            ctx.fillStyle = '#7a8aaa';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⬆ 請上傳遊戲截圖', w/2, y + 140);
            y += 290;
        }

        // ---- 3. 中間文字區塊（取代兩張圖）----
        const boxX = 50, boxW = 700;
        // 半透明底框
        ctx.fillStyle = 'rgba(20, 40, 70, 0.85)';
        ctx.shadowColor = '#2a6a9a';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.roundRect(boxX, y, boxW, 240, 16);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 標題
        ctx.fillStyle = '#ffd966';
        ctx.font = 'bold 26px "Segoe UI", "PingFang TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🛡️ 專業護航服務內容', w/2, y + 44);
        
        // 項目
        const items = [
            '🔹 專業護航 · 安全撤離', 
            '🔹 高價值物資搜集', 
            '🔹 緊急救援與復活', 
            '🔹 最佳路線規劃', 
            '🔹 清場效率提升 · 生存率提高'
        ];
        ctx.font = '20px "Segoe UI", "PingFang TC", sans-serif';
        ctx.fillStyle = '#d4e2f5';
        ctx.textAlign = 'left';
        let itemY = y + 84;
        items.forEach((txt) => {
            ctx.fillText(txt, boxX + 40, itemY);
            itemY += 34;
        });
        y += 270;

        // ---- 4. 客戶回饋對話框 ----
        ctx.fillStyle = 'rgba(10, 25, 45, 0.9)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#1a4a7a';
        ctx.beginPath();
        ctx.roundRect(50, y, 700, 130, 14);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#c8daf5';
        ctx.font = '18px "Segoe UI", "PingFang TC", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('💬 客戶回饋', 70, y + 34);
        ctx.fillStyle = '#f0e6d0';
        ctx.font = '20px "Segoe UI", "PingFang TC", sans-serif';
        ctx.fillText('「玩得開心喔 感恩！」', 70, y + 76);
        ctx.fillStyle = '#aab8d0';
        ctx.font = '16px sans-serif';
        ctx.fillText('—— 真實客戶評價', 70, y + 108);
        y += 160;

        // ---- 5. 底部品牌 ----
        ctx.fillStyle = '#e6d8b8';
        ctx.font = 'bold 22px "Segoe UI", "PingFang TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('真實報 · 真實好 · 專業團隊 · 值得信賴', w/2, y + 20);
        y += 50;
        ctx.fillStyle = '#6a8aaa';
        ctx.font = '16px sans-serif';
        ctx.fillText('期待下次與您一起出發！', w/2, y + 10);

        // 小裝飾線
        ctx.strokeStyle = '#ffd96666';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(100, y + 40);
        ctx.lineTo(700, y + 40);
        ctx.stroke();
    }

    // 工具：canvas roundRect
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
    };

    // ---------- 上傳事件 ----------
    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                uploadedImage = img;
                drawFinalImage(img);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 下載
    document.getElementById('downloadBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = '護航成果圖.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    // 重置
    document.getElementById('resetBtn').addEventListener('click', () => {
        uploadedImage = null;
        fileInput.value = '';
        drawFinalImage(null);
    });

    // 初始繪製（無圖）
    drawFinalImage(null);
</script>

</body>
</html>
