<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Open Road｜自由駕駛</title>
<style>
:root{color-scheme:dark;--bg:#10151b;--panel:#1c2630;--accent:#62e6a7;--muted:#9eacb8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#a9d6e5}
.hud{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#101820d9;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;font-size:13px;backdrop-filter:blur(6px)}
#menu{position:fixed;inset:0;background:#091018d9;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.card{width:min(560px,100%);max-height:92dvh;overflow:auto;background:#17212b;border:1px solid #ffffff20;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0008}
h1{margin:0 0 6px;font-size:28px}p{color:var(--muted);line-height:1.45;margin:8px 0 16px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab,button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#2a3946;color:#fff;font-size:14px}.tab.active,button.primary{background:var(--accent);color:#102018}.panel{background:#101820;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:9px 0}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}button:active,.ctrl:active{transform:scale(.96)}
#controls{position:fixed;bottom:calc(env(safe-area-inset-bottom,8px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.cluster{display:flex;gap:10px;pointer-events:auto}.ctrl{width:64px;height:64px;border-radius:20px;background:#111a22cc;border:1px solid #ffffff38;color:white;font-size:23px;font-weight:800;touch-action:none;user-select:none;display:grid;place-items:center;box-shadow:0 5px 18px #0004}.ctrl.gas{height:82px;background:#1a805cdd}.ctrl.brake{height:70px;background:#a63e45dd}.ctrl.active{outline:3px solid var(--accent)}
#notice{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#101820dd;padding:10px 16px;border-radius:12px;display:none}
@media(min-width:800px){.ctrl{width:74px;height:74px}.ctrl.gas{height:90px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="pill">🚗 <b id="carLabel">街頭跑車</b><br><span id="speed">0</span> km/h</div>
 <div class="pill">距離 <b id="distance">0</b> m<br>點數 <b id="coins">0</b></div>
 <div class="pill">最佳 <b id="best">0</b> m</div>
</div>
<div id="notice"></div>
<div id="menu">
 <div class="card">
  <h1>🏁 Open Road</h1><p>開放世界自由駕駛 · 避開車流、探索城市、賺取點數並升級你的車。</p>
  <div class="tabs">
   <button class="tab active" data-tab="drive">開始駕駛</button>
   <button class="tab" data-tab="garage">車庫改裝</button>
   <button class="tab" data-tab="records">紀錄排行</button>
  </div>
  <section id="drive" class="section">
   <div class="panel"><div class="row"><span>目前車輛</span><b id="selectedCar">街頭跑車</b></div><div class="row"><span>車款</span><div class="actions"><button id="prevCar">◀</button><button id="nextCar">▶</button></div></div><div class="small" id="carDesc">均衡的入門車款</div></div>
   <div class="actions"><button class="primary" id="start">開始自由駕駛</button><button id="soundToggle">🔊 音效：開</button></div>
   <p class="small">手機請橫向遊玩。左側控制轉向，右側油門與煞車。碰撞後車輛會停下，重新按油門起步。</p>
  </section>
  <section id="garage" class="section" hidden>
   <div class="panel"><div class="row"><span>遊戲點數</span><b id="garageCoins">0</b></div><div class="row"><span>引擎等級 <b id="engineLv">1</b></span><button id="upgradeEngine">升級（100）</button></div><div class="row"><span>操控等級 <b id="handlingLv">1</b></span><button id="upgradeHandling">升級（100）</button></div><div class="row"><span>煞車等級 <b id="brakeLv">1</b></span><button id="upgradeBrake">升級（100）</button></div></div>
   <div class="panel"><b>車輛收藏</b><div id="carList"></div></div>
  </section>
  <section id="records" class="section" hidden>
   <div class="panel"><div class="row"><span>最佳行駛距離</span><b id="recordBest">0 m</b></div><div class="row"><span>累積行駛距離</span><b id="recordTotal">0 m</b></div><div class="row"><span>累積點數</span><b id="recordCoins">0</b></div><div class="row"><span>碰撞次數</span><b id="recordHits">0</b></div></div><p class="small">排行榜紀錄保存在這台裝置的瀏覽器中。</p><button id="resetData">重設遊戲資料</button>
  </section>
 </div>
</div>
<div id="controls">
 <div class="cluster"><button class="ctrl" data-control="left">◀</button><button class="ctrl" data-control="right">▶</button></div>
 <div class="cluster"><button class="ctrl brake" data-control="brake">煞車</button><button class="ctrl gas" data-control="gas">油門</button></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const cars=[
 {name:'街頭跑車',price:0,color:'#f4f5f7',speed:1,handling:1,desc:'均衡的入門車款'},
 {name:'霓虹轎跑',price:300,color:'#62e6a7',speed:1.18,handling:1.05,desc:'加速更快，適合城市巡航'},
 {name:'火焰肌肉車',price:650,color:'#ff775f',speed:1.35,handling:.9,desc:'直線速度強，轉向較重'},
 {name:'電光超跑',price:1200,color:'#9b91ff',speed:1.5,handling:1.25,desc:'高速與操控兼備'}
];
const defaults={coins:0,unlocked:[0],car:0,engine:1,handling:1,brake:1,best:0,total:0,hits:0};
let save;try{save={...defaults,...JSON.parse(localStorage.getItem('openRoadSave')||'{}')}}catch(e){save={...defaults}}
function persist(){try{localStorage.setItem('openRoadSave',JSON.stringify(save))}catch(e){} updateUI()}
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
let running=false,paused=false,menuOpen=true,world=0,roadX=0,playerX=0,speed=0,dist=0,coinRun=0,hitFlash=0,hitCooldown=0,traffic=[],last=0;
let input={left:false,right:false,gas:false,brake:false};
let soundOn=true,audio=null,engineOsc=null,engineGain=null,musicTimer=null,musicStep=0;
function audioStart(){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!engineOsc){engineOsc=audio.createOscillator();engineGain=audio.createGain();engineOsc.type='sawtooth';engineGain.gain.value=0;engineOsc.connect(engineGain);engineGain.connect(audio.destination);engineOsc.start()}if(!musicTimer){musicTimer=setInterval(()=>{if(!soundOn||!audio||audio.state!=='running')return;const notes=[220,277,330,277,196,247,294,247];const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[musicStep++%notes.length];g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)},260)}}catch(e){}}
function beep(freq=130,dur=.15,type='square',vol=.08){if(!soundOn)return;try{audioStart();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function updateEngine(){if(engineOsc&&audio){engineOsc.frequency.setTargetAtTime(65+speed*2.4,audio.currentTime,.08);engineGain.gain.setTargetAtTime(soundOn&&running?Math.min(.045,speed/1800):0,audio.currentTime,.08)}}
function updateUI(){
 $('carLabel').textContent=cars[save.car].name;$('selectedCar').textContent=cars[save.car].name;$('carDesc').textContent=cars[save.car].desc;
 $('speed').textContent=Math.round(speed*1.5);$('distance').textContent=Math.floor(dist);$('coins').textContent=save.coins;$('best').textContent=save.best;
 $('garageCoins').textContent=save.coins;$('engineLv').textContent=save.engine;$('handlingLv').textContent=save.handling;$('brakeLv').textContent=save.brake;
 $('recordBest').textContent=save.best+' m';$('recordTotal').textContent=save.total+' m';$('recordCoins').textContent=save.coins;$('recordHits').textContent=save.hits;
 $('upgradeEngine').textContent='升級（'+(save.engine*100)+'）';$('upgradeHandling').textContent='升級（'+(save.handling*100)+'）';$('upgradeBrake').textContent='升級（'+(save.brake*100)+'）';
 $('prevCar').disabled=save.unlocked.length<2;$('nextCar').disabled=save.unlocked.length<2;
 $('carList').innerHTML=cars.map((c,i)=>`<div class="row"><span>${c.name} ${save.unlocked.includes(i)?'✓':('· '+c.price+' 點')}</span><button data-buy="${i}" ${save.unlocked.includes(i)?(save.car===i?'disabled':''):(save.coins<c.price?'disabled':'')}>${save.unlocked.includes(i)?(save.car===i?'使用中':'選擇'):'解鎖'}</button></div>`).join('');
}
function showNotice(t){$('notice').textContent=t;$('notice').style.display='block';clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>$('notice').style.display='none',1300)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.hidden=x.id!==b.dataset.tab)}));
$('prevCar').onclick=()=>cycleCar(-1);$('nextCar').onclick=()=>cycleCar(1);
function cycleCar(dir){let idx=save.unlocked.indexOf(save.car);save.car=save.unlocked[(idx+dir+save.unlocked.length)%save.unlocked.length];persist()}
$('carList').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(!b)return;const i=+b.dataset.buy;if(save.unlocked.includes(i)){save.car=i;persist()}else if(save.coins>=cars[i].price){save.coins-=cars[i].price;save.unlocked.push(i);save.car=i;persist();showNotice('已解鎖 '+cars[i].name)}});
function upgrade(key){const lv=save[key],cost=lv*100;if(lv>=5){showNotice('已達最高等級');return}if(save.coins<cost){showNotice('點數不足');return}save.coins-=cost;save[key]++;persist();beep(620,.1,'sine')}
$('upgradeEngine').onclick=()=>upgrade('engine');$('upgradeHandling').onclick=()=>upgrade('handling');$('upgradeBrake').onclick=()=>upgrade('brake');
$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 音效：開':'🔇 音效：關';if(soundOn)audioStart();else if(engineGain&&audio)engineGain.gain.setTargetAtTime(0,audio.currentTime,.05)};
$('resetData').onclick=()=>{if(confirm('確定重設所有遊戲紀錄與解鎖車輛？')){save={...defaults,unlocked:[0]};persist();showNotice('資料已重設')}};

// 修正：start 只綁定一次，並正確啟動遊戲循環
$('start').onclick=()=>{
  audioStart();
  $('menu').style.display='none';
  running=true;menuOpen=false;
  last=performance.now();
  if(!traffic.length)spawnTraffic();
  showNotice('自由駕駛開始！');
  requestAnimationFrame(loop);
};

function spawnTraffic(){traffic=[];for(let i=0;i<8;i++)traffic.push({x:(Math.random()-.5)*.9,y:-i*260-200,s:0.7+Math.random()*.55,color:['#e65b50','#f1c75b','#5a92db','#e7edf2'][i%4],passed:false})}
const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'brake'};
addEventListener('keydown',e=>{if(keys[e.key]){input[keys[e.key]]=true;e.preventDefault()}if(e.key==='Escape'&&running)toggleMenu()});
addEventListener('keyup',e=>{if(keys[e.key])input[keys[e.key]]=false});

// 修正：按鈕事件改用 pointerdown/up，並加上 touchstart 兼容
document.querySelectorAll('[data-control]').forEach(b=>{
  const k=b.dataset.control;
  const down=e=>{
    e.preventDefault();e.stopPropagation();
    input[k]=true;b.classList.add('active');
    if(k==='gas'){audioStart();if(speed===0&&hitCooldown>0){hitCooldown=0;showNotice('重新起步')}}
  };
  const up=e=>{e.preventDefault();e.stopPropagation();input[k]=false;b.classList.remove('active')};
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
  b.addEventListener('pointerleave',up);
  // 兼容舊版 iOS
  b.addEventListener('touchstart',down,{passive:false});
  b.addEventListener('touchend',up,{passive:false});
  b.addEventListener('touchcancel',up,{passive:false});
});

function toggleMenu(){running=false;$('menu').style.display='flex';menuOpen=true;updateUI()}
function collide(){if(hitCooldown>0)return;speed=0;hitCooldown=1.2;hitFlash=.6;save.hits++;beep(75,.28,'sawtooth',.13);showNotice('碰撞！車輛停止，按油門重新起步');persist()}

function update(dt){
 if(!running)return;
 hitCooldown=Math.max(0,hitCooldown-dt);hitFlash=Math.max(0,hitFlash-dt);
 const car=cars[save.car],maxSpeed=(48+save.engine*7)*car.speed;
 if(input.gas){if(speed===0&&hitCooldown>0)hitCooldown=0;speed=Math.min(maxSpeed,speed+(18+save.engine*3)*dt)}else if(input.brake)speed=Math.max(0,speed-(40+save.brake*9)*dt);else speed=Math.max(0,speed-5*dt);
 if(input.left)playerX-=dt*(.85+speed/80)*(1+save.handling*.08)*car.handling;
 if(input.right)playerX+=dt*(.85+speed/80)*(1+save.handling*.08)*car.handling;
 playerX=Math.max(-1.05,Math.min(1.05,playerX));
 if(Math.abs(playerX)>.98){speed=Math.max(0,speed-28*dt);playerX=Math.sign(playerX)*.98}
 const travel=speed*dt*2.4;world+=travel;dist+=travel*.1;save.total+=travel*.1;coinRun+=travel*.035;
 if(coinRun>=1){const earned=Math.floor(coinRun);save.coins+=earned;coinRun-=earned}
 for(const t of traffic){t.y+=travel*(1.2-t.s*.25);if(t.y>H+80){t.y=-120-Math.random()*400;t.x=(Math.random()-.5)*.9;t.passed=false}
 const px=W/2+playerX*W*.28,py=H*.76,tx=W/2+t.x*W*.28,ty=t.y;
 if(Math.abs(px-tx)<Math.min(45,W*.065)&&Math.abs(py-ty)<48&&speed>2){collide();t.y=-500-Math.random()*300}
 }
 if(dist>save.best){save.best=Math.floor(dist)}
 updateEngine();updateUI();
}

function roadCurve(z){return Math.sin((world+z)*.0011)*W*.09+Math.sin((world+z)*.00043)*W*.06}

function drawCar(x,y,w,h,color,player=false){
 ctx.save();ctx.translate(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(2,h*.25,w*.7,h*.55,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-w*.42,h*.5);ctx.lineTo(-w*.5,-h*.15);ctx.lineTo(-w*.29,-h*.48);ctx.lineTo(w*.29,-h*.48);ctx.lineTo(w*.5,-h*.15);ctx.lineTo(w*.42,h*.5);ctx.closePath();ctx.fill();
 ctx.fillStyle='#182c3b';ctx.beginPath();ctx.moveTo(-w*.27,-h*.15);ctx.lineTo(-w*.19,-h*.38);ctx.lineTo(w*.19,-h*.38);ctx.lineTo(w*.27,-h*.15);ctx.closePath();ctx.fill();
 ctx.fillStyle=player?'#ffed9c':'#ff413e';ctx.fillRect(-w*.36,h*.25,w*.2,h*.09);ctx.fillRect(w*.16,h*.25,w*.2,h*.09);
 ctx.fillStyle='#111';ctx.fillRect(-w*.53,-h*.25,w*.12,h*.25);ctx.fillRect(w*.41,-h*.25,w*.12,h*.25);ctx.fillRect(-w*.53,h*.2,w*.12,h*.25);ctx.fillRect(w*.41,h*.2,w*.12,h*.25);ctx.restore();
}

function render(){
 ctx.clearRect(0,0,W,H);
 const horizon=H*.31;
 ctx.fillStyle='#9ed9ed';ctx.fillRect(0,0,W,horizon);
 ctx.fillStyle='#80b6b1';for(let i=0;i<12;i++){let x=i*W/10-(world*.08% (W/10));let hh=25+(i*37%70);ctx.fillRect(x,horizon-hh,W/18,hh)}
 ctx.fillStyle='#5d9d67';ctx.fillRect(0,horizon,W,H-horizon);
 for(let i=0;i<10;i++){let y=((i*120+world*.7)%(H+120))-60;let bh=35+(i*23%60);ctx.fillStyle=i%2?'#c8c4b5':'#d9d2c1';ctx.fillRect(8+Math.sin(i)*18,y,bh*.65,bh);ctx.fillRect(W-bh*.7-8,y+25,bh*.65,bh)}
 let cx=W/2+roadCurve(0);const topW=Math.min(W*.24,150),botW=Math.min(W*.95,650);
 ctx.fillStyle='#555d63';ctx.beginPath();ctx.moveTo(cx-topW/2,horizon);ctx.lineTo(cx+topW/2,horizon);ctx.lineTo(W/2+botW/2,H);ctx.lineTo(W/2-botW/2,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#e9e5cf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-topW/2,horizon);ctx.lineTo(W/2-botW/2,H);ctx.moveTo(cx+topW/2,horizon);ctx.lineTo(W/2+botW/2,H);ctx.stroke();
 for(let i=0;i<12;i++){let z=((i*95+world*1.4)%(H-horizon));let p=z/(H-horizon),y=horizon+z;let width=1+p*4;ctx.fillStyle='#f8f3d9';ctx.fillRect(W/2+roadCurve(z)-width/2,y,width,12+p*25)}
 for(const t of traffic){let p=Math.max(.2,Math.min(1.3,(t.y-horizon)/(H-horizon)));let x=W/2+roadCurve(t.y)+t.x*(botW*.42);drawCar(x,t.y,20+p*18,35+p*22,t.color,false)}
 drawCar(W/2+playerX*W*.28,H*.76,Math.max(34,W*.065),Math.max(58,H*.12),cars[save.car].color,true);
 if(hitFlash>0){ctx.fillStyle=`rgba(255,60,50,${hitFlash*.25})`;ctx.fillRect(0,0,W,H)}
}

// 修正：單一遊戲循環，同時處理 update 和 render
function loop(ts){
  const dt=Math.min(.04,(ts-last)/1000||0);last=ts;
  update(dt);
  render();
  if(running)requestAnimationFrame(loop);
}

updateUI();
render(); // 初始畫面
})();
</script>
</body>
</html>
