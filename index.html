<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俱樂部專業點單系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f4f9; margin: 0; padding: 16px; }
        .app { max-width: 800px; margin: 0 auto; }
        
        /* 頁籤切換 */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            flex: 1; min-width: 100px; padding: 12px; border: none;
            border-radius: 40px; font-weight: 700; font-size: 14px;
            background: white; color: #555; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: 0.2s;
        }
        .tab-btn.active { background: #1a2b3c; color: white; box-shadow: 0 4px 12px rgba(26,43,60,0.3); }
        .tab-btn:hover { transform: translateY(-2px); }
        .page { display: none; }
        .page.active { display: block; }

        /* 卡片 */
        .card {
            background: white; border-radius: 24px; padding: 28px 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; color: #1a2b3c; border-left: 5px solid #2a7de1; padding-left: 15px; }
        .field { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 5px; }
        label .required { color: #e74c3c; }
        input, select, textarea {
            width: 100%; padding: 12px 14px; border: 1px solid #d0d7de;
            border-radius: 12px; font-size: 15px; transition: 0.2s;
            background: white;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #2a7de1; outline: none; box-shadow: 0 0 0 3px rgba(42,125,225,0.15);
        }
        textarea { min-height: 60px; resize: vertical; }
        .btn-primary {
            width: 100%; padding: 14px; background: #2a7de1; color: white;
            border: none; border-radius: 40px; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { background: #1a5fb4; transform: scale(0.98); }
        .btn-danger {
            background: #e74c3c; padding: 8px 16px; border: none;
            border-radius: 30px; color: white; font-weight: 600; cursor: pointer;
        }
        .btn-danger:hover { background: #c0392b; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #1a2b3c; color: white; padding: 12px 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #edf2f7; }
        .badge {
            background: #e1f0fa; color: #0a558c; padding: 3px 14px;
            border-radius: 30px; font-size: 12px; font-weight: 700;
        }
        .empty { text-align: center; color: #999; padding: 40px 0; }

        /* 手機卡片列表 */
        .order-card {
            background: white; border-radius: 16px; padding: 16px 18px;
            margin-bottom: 12px; border-left: 5px solid #2a7de1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .order-card .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .order-card .label { color: #6b7a8a; font-size: 13px; font-weight: 600; }
        .order-card .value { font-weight: 600; color: #0b1e2e; }
        .player-tag {
            background: #d4e2fc; padding: 2px 14px; border-radius: 30px;
            font-size: 13px; font-weight: 700; color: #1a4f8b;
        }

        @media (max-width: 600px) {
            .card { padding: 18px 16px; }
            .tabs .tab-btn { font-size: 12px; min-width: 70px; padding: 10px; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            td { padding: 6px 10px; padding-left: 40%; position: relative; border: none; }
            td::before {
                content: attr(data-label); position: absolute; left: 10px;
                font-weight: 700; color: #1a2b3c; width: 35%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 頁籤 -->
    <div class="tabs">
        <button class="tab-btn active" data-page="page1">📝 點單</button>
        <button class="tab-btn" data-page="page2">📊 總表</button>
        <button class="tab-btn" data-page="page3">📱 手機版</button>
    </div>

    <!-- ====== 頁面一：點單表單 ====== -->
    <div id="page1" class="page active">
        <div class="card">
            <h2>📋 新增點單</h2>
            <form id="orderForm">
                <div class="field">
                    <label>客戶姓名 <span class="required">*</span></label>
                    <input type="text" id="clientName" placeholder="請輸入全名" required>
                </div>
                <div class="field">
                    <label>聯絡資訊 <span class="required">*</span></label>
                    <input type="text" id="contact" placeholder="手機 / Line ID">
                </div>
                <div class="field">
                    <label>點單時間</label>
                    <input type="datetime-local" id="orderTime" readonly style="background:#f8f9fa;">
                </div>
                <div class="field">
                    <label>指定打手 <span class="required">*</span></label>
                    <select id="player" required>
                        <option value="">— 請選擇 —</option>
                        <option value="阿豪">阿豪</option>
                        <option value="小陳">小陳</option>
                        <option value="大衛">大衛</option>
                        <option value="Mike">Mike</option>
                    </select>
                </div>
                <div class="field">
                    <label>補充說明</label>
                    <textarea id="remark" placeholder="特殊需求、備註…"></textarea>
                </div>
                <div class="field">
                    <label>結單時間</label>
                    <input type="datetime-local" id="closeTime">
                </div>
                <div class="field">
                    <label>結單截圖</label>
                    <input type="file" id="screenshot" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">✅ 送出點單</button>
            </form>
        </div>
    </div>

    <!-- ====== 頁面二：總表 ====== -->
    <div id="page2" class="page">
        <div class="card">
            <h2>📊 所有紀錄 <span id="countDisplay" style="font-size:14px;color:#888;font-weight:400;"></span></h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr>
                        <th>客戶</th><th>聯絡</th><th>點單時間</th><th>打手</th><th>補充</th><th>結單時間</th><th>截圖</th>
                    </tr></thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" class="empty">目前尚無資料，請先新增點單</td></tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
                <button class="btn-danger" onclick="clearAll()">🗑 清除全部</button>
                <button class="btn-primary" style="width:auto; padding:8px 24px;" onclick="exportCSV()">📥 匯出 CSV</button>
            </div>
        </div>
    </div>

    <!-- ====== 頁面三：手機版 ====== -->
    <div id="page3" class="page">
        <div class="card">
            <h2>📱 即時清單</h2>
            <div id="mobileList">
                <div class="empty">尚無資料</div>
            </div>
        </div>
    </div>
</div>

<script>
// ====== 資料儲存 ======
let orders = JSON.parse(localStorage.getItem('clubOrders')) || [];

// ====== 儲存 ======
function save() {
    localStorage.setItem('clubOrders', JSON.stringify(orders));
    renderAll();
}

// ====== 設定現在時間 ======
function setNow() {
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    document.getElementById('orderTime').value = local.toISOString().slice(0,16);
}
setNow();

// ====== 新增訂單 ======
document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const client = document.getElementById('clientName').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const player = document.getElementById('player').value;
    const remark = document.getElementById('remark').value.trim();
    const closeTime = document.getElementById('closeTime').value;
    const fileInput = document.getElementById('screenshot');
    let fileName = '';
    if (fileInput.files.length > 0) {
        fileName = fileInput.files[0].name;
    }
    if (!client || !player) {
        alert('請填寫客戶姓名與指定打手');
        return;
    }
    const order = {
        id: Date.now(),
        client,
        contact: contact || '—',
        orderTime: document.getElementById('orderTime').value || new Date().toISOString().slice(0,16),
        player,
        remark: remark || '—',
        closeTime: closeTime || '未結單',
        screenshot: fileName || '未上傳'
    };
    orders.unshift(order);
    save();
    this.reset();
    setNow();
    document.getElementById('closeTime').value = '';
    alert('✅ 點單已送出！');
});

// ====== 渲染全部 ======
function renderAll() {
    renderTable();
    renderMobile();
    document.getElementById('countDisplay').textContent = `（共 ${orders.length} 筆）`;
}

// ====== 渲染總表 ======
function renderTable() {
    const tbody = document.getElementById('tableBody');
    if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">目前尚無資料</td></tr>';
        return;
    }
    tbody.innerHTML = orders.map(o => `
        <tr>
            <td data-label="客戶">${o.client}</td>
            <td data-label="聯絡">${o.contact}</td>
            <td data-label="點單時間">${o.orderTime}</td>
            <td data-label="打手"><span class="badge">${o.player}</span></td>
            <td data-label="補充">${o.remark}</td>
            <td data-label="結單時間">${o.closeTime}</td>
            <td data-label="截圖">${o.screenshot}</td>
        </tr>
    `).join('');
}

// ====== 渲染手機版 ======
function renderMobile() {
    const container = document.getElementById('mobileList');
    if (orders.length === 0) {
        container.innerHTML = '<div class="empty">尚無資料</div>';
        return;
    }
    container.innerHTML = orders.map(o => `
        <div class="order-card">
            <div class="row"><span class="label">👤 客戶</span><span class="value">${o.client}</span></div>
            <div class="row"><span class="label">📞 聯絡</span><span class="value">${o.contact}</span></div>
            <div class="row"><span class="label">⏰ 點單</span><span class="value">${o.orderTime}</span></div>
            <div class="row"><span class="label">🎯 打手</span><span class="player-tag">${o.player}</span></div>
            <div class="row"><span class="label">📝 補充</span><span class="value" style="font-weight:400;">${o.remark}</span></div>
            <hr style="margin:8px 0;border:0;border-top:1px dashed #ddd;">
            <div class="row"><span class="label">🔚 結單</span><span class="value">${o.closeTime}</span></div>
            <div class="row"><span class="label">🖼 截圖</span><span class="value" style="font-weight:400;font-size:13px;">${o.screenshot}</span></div>
        </div>
    `).join('');
}

// ====== 清除全部 ======
function clearAll() {
    if (confirm('確定要刪除所有紀錄嗎？')) {
        orders = [];
        save();
    }
}

// ====== 匯出 CSV ======
function exportCSV() {
    if (orders.length === 0) { alert('沒有資料可匯出'); return; }
    const headers = ['客戶','聯絡','點單時間','打手','補充','結單時間','截圖'];
    const rows = orders.map(o => [o.client, o.contact, o.orderTime, o.player, o.remark, o.closeTime, o.screenshot]);
    let csv = headers.join(',') + '\n' + rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `俱樂部紀錄_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
}

// ====== 頁籤切換 ======
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(this.dataset.page).classList.add('active');
    });
});

// ====== 初始化 ======
renderAll();
</script>
</body>
</html>
